<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
  <title>Snapmark — Annotate</title>
  <link rel="stylesheet" href="{{styleUri}}" />
</head>
<body data-dock="left">
  <div id="tools" class="glass bar" role="toolbar" aria-label="Tools">
    <button class="grip" id="tools-grip" title="Drag to move the toolbar (or use arrow keys). Drag a tool to reorder it." aria-label="Move toolbar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="8" cy="5" r="2"/><circle cx="16" cy="5" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="19" r="2"/><circle cx="16" cy="19" r="2"/></svg>
    </button>
    <button class="tool" data-tool="select" title="Select (V)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 17 2.51-7.39L20 10.07z"/></svg>
    </button>
    <button class="tool" data-tool="pen" title="Pen (P)" aria-pressed="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
    </button>
    <button class="tool" data-tool="arrow" title="Arrow (A)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg>
    </button>
    <button class="tool" data-tool="arrow2" title="Two-way arrow (D)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="11 5 19 5 19 13"/><polyline points="5 11 5 19 13 19"/></svg>
    </button>
    <button class="tool" data-tool="rect" title="Rectangle (R)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/></svg>
    </button>
    <button class="tool" data-tool="ellipse" title="Ellipse (E)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg>
    </button>
    <button class="tool" data-tool="text" title="Text (T)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
    </button>
    <button class="tool" data-tool="comment" title="Comment (M)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-8a8 8 0 1 1 8 8z"/></svg>
    </button>
    <button class="tool" data-tool="highlight" title="Highlight (H)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-6 6v3h3l6-6"/><path d="M22 12l-4.5 4.5a2.1 2.1 0 0 1-3 0L9 12l6-6 4.5 4.5a2.1 2.1 0 0 1 0 3z"/></svg>
    </button>
    <button class="tool" data-tool="crop" title="Crop (C)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
    </button>
    <button class="tool" data-tool="redact" title="Redact — black out sensitive region (B)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="16" y="9.5" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.5" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg>
    </button>
    <button class="tool" data-tool="number" title="Numbered step (N)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><text x="12" y="16" text-anchor="middle" font-size="10" font-family="sans-serif" font-weight="600" fill="currentColor" stroke="none">1</text></svg>
    </button>
  </div>

  <header id="topbar">
    <div id="commit">
      <button class="action glass" id="btn-upload" title="Open a different image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/></svg>
        Upload
      </button>
      <input id="file-input" type="file" accept="image/*" hidden />
      <button class="action primary" id="btn-done" title="Copy to clipboard (⌘⏎)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
      <button class="action icon glass" id="btn-cancel" title="Close (Esc)" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="crop-actions" class="glass" hidden>
      <button class="action" id="crop-cancel" title="Cancel crop (Esc)">Cancel</button>
      <button class="action primary" id="crop-apply" title="Apply crop (Enter)">Apply crop</button>
    </div>
    <div id="empty-state">Loading image…</div>
  </div>

  <footer id="stylebar" class="glass bar" role="toolbar" aria-label="Style">
    <div class="tool-group" data-group="widths">
      <button class="width" data-width="2" title="Thin">
        <span class="width-dot" style="width:4px;height:4px"></span>
      </button>
      <button class="width" data-width="4" title="Medium" aria-pressed="true">
        <span class="width-dot" style="width:8px;height:8px"></span>
      </button>
      <button class="width" data-width="8" title="Thick">
        <span class="width-dot" style="width:12px;height:12px"></span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="tool-group" data-group="colors">
      <button class="swatch" data-color="#ff3b30" style="--swatch:#ff3b30" title="Red"></button>
      <button class="swatch" data-color="#ff9500" style="--swatch:#ff9500" title="Orange"></button>
      <button class="swatch" data-color="#34c759" style="--swatch:#34c759" title="Green"></button>
      <button class="swatch" data-color="#007aff" style="--swatch:#007aff" title="Blue" aria-pressed="true"></button>
      <button class="swatch" data-color="#af52de" style="--swatch:#af52de" title="Purple"></button>
      <button class="swatch" data-color="#ffffff" style="--swatch:#ffffff" title="White"></button>
      <button class="swatch" data-color="#000000" style="--swatch:#000000" title="Black"></button>
    </div>

    <div class="divider"></div>

    <div class="tool-group" data-group="history">
      <button class="action icon" id="btn-undo" title="Undo (⌘Z)" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="action icon" id="btn-redo" title="Redo (⌘⇧Z)" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
    </div>

    <div class="divider"></div>

    <button class="action" id="btn-clear" title="Clear all annotations" disabled>Clear</button>
  </footer>

  <script nonce="{{nonce}}" src="{{fabricUri}}"></script>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
